[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.3.0"
description = "Read-only static repository analysis with evidence graphs, impact reports and local API contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Repository Lens contributors" }]
dependencies = []

[project.optional-dependencies]
# The capability index is YAML; everything else reads TOML, which is in the standard library.
yaml = ["PyYAML>=6"]
docs = ["pdoc>=14"]
stack = ["tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26",
         "tree-sitter-typescript>=0.23,<0.24", "sqlglot>=28.10,<29"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1", "PyYAML>=6"]

[project.scripts]
repolens = "repolens.cli:main"
# Kept so the standalone impact tracer's documented command still works.
impact-tracer = "repolens.impact.cli:main"

[tool.setuptools.packages.find]
include = ["repolens*"]

# `repolens init` and `repolens rules` read these at run time, from a checkout or a wheel.
[tool.setuptools.package-data]
repolens = ["templates/*"]
"repolens.rules" = ["*.md"]
# `repolens report --only lessons` reads the catalogue inside a TARGET repository,
# so it has to travel in the wheel, not sit in this checkout's docs/.
"repolens.lessons" = ["*.json"]
